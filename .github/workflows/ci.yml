name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin manifest and market index
        run: |
          node -e "const p=require('./package.json'); for (const k of ['main','exports','files','engines','dsh']) if (!p[k]) throw new Error('package.json missing '+k); if (!p.dsh.bundle?.patch) throw new Error('dsh.bundle.patch missing'); for (const f of ['lib/index.js','lib/client.js','cordis.patch.yml','icon.svg']) require('fs').accessSync(f); console.log('bundle manifest ok')"
          npx --yes tsx@4 scripts/market-index.ts check
